[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "3.0.0"
description = "FRIDAY AI OS — JARVIS-class Personal AI Assistant"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.25",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.0",
    "psutil>=6.0",
]

[project.optional-dependencies]
gui = ["PyQt6>=6.5"]
voice = [
    "SpeechRecognition>=3.10",
    "pyaudio",
    "edge-tts>=6.0",
    "pyttsx3>=2.90",
]
all = ["friday[gui,voice]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5.0"]

[project.scripts]
friday = "friday.main:_entry"

[tool.setuptools.packages.find]
include = ["friday*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
