[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "friday"
version = "2.9.0"
description = "FRIDAY AI OS — Autonomous AI assistant for Arch Linux"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "aiosqlite>=0.19",
    "rich>=13.0",
    "beautifulsoup4>=4.12",
    "edge-tts>=6.0",
    "SpeechRecognition>=3.10",
    "pyttsx3>=2.90",
    "psutil>=6.0",
    "playwright>=1.40",
    "qasync>=0.27",
    "pystray>=0.19",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "pre-commit>=3.0",
]

[project.scripts]
friday = "friday.main:main"

[tool.setuptools.packages.find]
include = ["friday*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
